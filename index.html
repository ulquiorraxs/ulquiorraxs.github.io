* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: system-ui, sans-serif; background: #f5f5f3; color: #1a1a18; padding: 2rem 1rem; }

.tab.active { background: #1a1a18; color: #fff; border-color: transparent; }
.day-card { background: #fff; border: 0.5px solid #ddd; border-radius: 12px; padding: 1.25rem; display: none; }

.day-header { display: flex; align-items: flex-start; justify-content: space-between; margin-bottom: 1rem; gap: 12px; }

.section { margin-bottom: 1rem; }

.timeline { display: flex; flex-direction: column; gap: 8px; }
.t-item { display: flex; gap: 10px; align-items: flex-start; }
.t-time { font-size: 12px; color: #888; min-width: 48px; padding-top: 1px; }
.t-dot { width: 6px; height: 6px; border-radius: 50%; background: #aaa; margin-top: 6px; flex-shrink: 0; }
.t-text { font-size: 13px; line-height: 1.5; flex: 1; }
.meals { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.meal-card { background: #f5f5f3; border-radius: 8px; padding: 10px 12px; }
.meal-type { font-size: 10px; color: #888; text-transform: uppercase; letter-spacing: 0.05em; margin-bottom: 3px; }
.meal-name { font-size: 13px; font-weight: 500; }
.meal-note { font-size: 12px; color: #888; margin-top: 2px; }
.budget-row { display: flex; gap: 8px; flex-wrap: wrap; }
.bud { font-size: 12px; padding: 4px 10px; border-radius: 8px; }
.bud-low { background: #EAF3DE; color: #3B6D11; }
.bud-med { background: #FAEEDA; color: #854F0B; }
.bud-high { background: #FAECE7; color: #993C1D; }
.links-row { display: flex; flex-wrap: wrap; gap: 6px; }
.link-btn { font-size: 12px; padding: 4px 10px; border-radius: 8px; border: 0.5px solid #ccc; color: #185FA5; background: transparent; cursor: pointer; text-decoration: none; display: inline-block; }

.divider { border: none; border-top: 0.5px solid #eee; margin: 0.75rem 0; }
.alt-box { background: #f5f5f3; border-radius: 8px; padding: 10px 12px; font-size: 13px; color: #666; }
.tip { font-size: 12px; color: #888; font-style: italic; margin-top: 4px; }
@media (max-width: 520px) {
  .stats { grid-template-columns: repeat(2, 1fr); }
  .meals { grid-template-columns: 1fr; }
}
</style>

const tabsEl = document.getElementById('tabs');
const cardsEl = document.getElementById('cards');
 
days.forEach((d, i) => {
  const tab = document.createElement('button');
  tab.className = 'tab' + (i === 0 ? ' active' : '');
  tab.textContent = d.label;
  tab.onclick = () => {
    document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
    tab.classList.add('active');
    document.querySelectorAll('.day-card').forEach(c => c.classList.remove('visible'));
    document.getElementById('card-' + i).classList.add('visible');
  };
  tabsEl.appendChild(tab);
 
  const card = document.createElement('div');
  card.className = 'day-card' + (i === 0 ? ' visible' : '');
  card.id = 'card-' + i;
 
  let html = `
    <div class="day-header">
      <div><div class="day-title">${d.title}</div><div class="day-date">${d.date}</div></div>
      <span class="badge ${d.badge.cls}">${d.badge.text}</span>
    </div>
    <div class="section">
      <div class="section-title">Schedule</div>
      <div class="timeline">${d.timeline.map(t=>`<div class="t-item"><span class="t-time">${t.time}</span><div class="t-dot"></div><span class="t-text">${t.text}</span></div>`).join('')}</div>
    </div>
    <hr class="divider">
    <div class="section">
      <div class="section-title">Meals</div>
      <div class="meals">${d.meals.map(m=>`<div class="meal-card"><div class="meal-type">${m.type}</div><div class="meal-name">${m.name}</div><div class="meal-note">${m.note}</div></div>`).join('')}</div>
    </div>
    <hr class="divider">
    <div class="section">
      <div class="section-title">Daily budget estimate</div>
      <div class="budget-row"><span class="bud bud-low">Low ${d.budget.low}</span><span class="bud bud-med">Mid ${d.budget.med}</span><span class="bud bud-high">High ${d.budget.high}</span></div>
      ${d.budgetNote ? `<p class="tip">${d.budgetNote}</p>` : ''}
    </div>`;
 
  if (d.links && d.links.length) {
    html += `<hr class="divider"><div class="section"><div class="section-title">Book / reserve</div><div class="links-row">${d.links.map(l=>`<a class="link-btn" href="${l.url}" target="_blank">${l.text} ↗</a>`).join('')}</div></div>`;
  }
  if (d.alt) {
    html += `<hr class="divider"><div class="section"><div class="section-title">Alternate option</div><div class="alt-box">${d.alt}</div></div>`;
  }
  if (d.tip) {
    html += `<hr class="divider"><p class="tip">💡 ${d.tip}</p>`;
  }
 
  card.innerHTML = html;
  cardsEl.appendChild(card);
});
</script>

    </div>
  </div>
</div>
 
<script>
const WMO_CODES = {
  0:"Clear sky",1:"Mainly clear",2:"Partly cloudy",3:"Overcast",
  45:"Foggy",48:"Icy fog",51:"Light drizzle",53:"Drizzle",55:"Heavy drizzle",
  61:"Light rain",63:"Rain",65:"Heavy rain",71:"Light snow",73:"Snow",75:"Heavy snow",
  80:"Rain showers",81:"Heavy showers",82:"Violent showers",
  95:"Thunderstorm",96:"Thunderstorm w/ hail",99:"Thunderstorm w/ heavy hail"
};
const WMO_EMOJI = {
  0:"☀️",1:"🌤",2:"⛅",3:"☁️",45:"🌫",48:"🌫",
  51:"🌦",53:"🌦",55:"🌧",61:"🌧",63:"🌧",65:"🌧",
  71:"❄️",73:"❄️",75:"❄️",80:"🌦",81:"🌧",82:"⛈",
  95:"⛈",96:"⛈",99:"⛈"
};
 
function dayName(dateStr) {
  const d = new Date(dateStr);
  return d.toLocaleDateString('en-US', { weekday:'short', month:'short', day:'numeric' });
}
 
async function fetchWeather() {
  document.getElementById('weather-loading').style.display = 'block';
  document.getElementById('weather-data').style.display = 'none';
  document.getElementById('weather-error').style.display = 'none';
 
  try {
    // Ubud, Bali coordinates
    const lat = -8.5069, lon = 115.2625;
    const url = `https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&current=temperature_2m,relative_humidity_2m,weather_code,wind_speed_10m,precipitation&daily=weather_code,temperature_2m_max,temperature_2m_min,precipitation_sum&timezone=Asia%2FSingapore&forecast_days=7&temperature_unit=celsius`;
 
    const res = await fetch(url);
    if (!res.ok) throw new Error('Weather fetch failed');
    const data = await res.json();
 
    const c = data.current;
    const code = c.weather_code;
 
    document.getElementById('current-weather').innerHTML = `
      <div style="background:#f5f5f3;border-radius:8px;padding:12px;text-align:center;">
        <div style="font-size:28px;">${WMO_EMOJI[code] || '🌡'}</div>
        <div style="font-size:22px;font-weight:500;margin-top:4px;">${Math.round(c.temperature_2m)}°C</div>
        <div style="font-size:12px;color:#888;margin-top:2px;">${WMO_CODES[code] || 'Unknown'}</div>
      </div>
      <div style="background:#f5f5f3;border-radius:8px;padding:12px;">
        <div style="font-size:11px;color:#888;text-transform:uppercase;letter-spacing:0.05em;">Humidity</div>
        <div style="font-size:20px;font-weight:500;margin-top:4px;">${c.relative_humidity_2m}%</div>
        <div style="font-size:12px;color:#888;margin-top:2px;">Relative humidity</div>
      </div>
      <div style="background:#f5f5f3;border-radius:8px;padding:12px;">
        <div style="font-size:11px;color:#888;text-transform:uppercase;letter-spacing:0.05em;">Wind</div>
        <div style="font-size:20px;font-weight:500;margin-top:4px;">${Math.round(c.wind_speed_10m)} km/h</div>
        <div style="font-size:12px;color:#888;margin-top:2px;">Wind speed</div>
      </div>
      <div style="background:#f5f5f3;border-radius:8px;padding:12px;">
        <div style="font-size:11px;color:#888;text-transform:uppercase;letter-spacing:0.05em;">Precipitation</div>
        <div style="font-size:20px;font-weight:500;margin-top:4px;">${c.precipitation} mm</div>
        <div style="font-size:12px;color:#888;margin-top:2px;">Current hour</div>
      </div>
    `;
 
    const forecastHTML = data.daily.time.map((date, i) => {
      const dcode = data.daily.weather_code[i];
      return `
        <div style="background:#f5f5f3;border-radius:8px;padding:10px 12px;min-width:100px;flex-shrink:0;text-align:center;">
          <div style="font-size:11px;color:#888;">${dayName(date)}</div>
          <div style="font-size:22px;margin:6px 0;">${WMO_EMOJI[dcode] || '🌡'}</div>
          <div style="font-size:13px;font-weight:500;">${Math.round(data.daily.temperature_2m_max[i])}°</div>
          <div style="font-size:12px;color:#aaa;">${Math.round(data.daily.temperature_2m_min[i])}°</div>
          <div style="font-size:11px;color:#185FA5;margin-top:4px;">${data.daily.precipitation_sum[i]}mm</div>
        </div>`;
    }).join('');
 
    document.getElementById('forecast-row').innerHTML = forecastHTML;
    document.getElementById('weather-loading').style.display = 'none';
    document.getElementById('weather-data').style.display = 'block';
 
  } catch(e) {
    document.getElementById('weather-loading').style.display = 'none';
    document.getElementById('weather-error').style.display = 'block';
    document.getElementById('weather-error').textContent = 'Could not load weather. Check your internet connection and try again.';
  }
}
 
fetchWeather();
</script>
</body>
</html>
